name: Publish Package to npmjs

on:
  release:
    # `published` also fires when a draft release is published; `created` does
    # not fire for releases first saved as drafts.
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org'
      # Ensure npm 11.5.1 or later is installed
      - name: Update npm
        run: npm install -g npm@latest
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run tests
        run: yarn test
      # Builds the package, then runs the WPT suite against the built
      # `js/URL.js` that is about to be published.
      - name: Run WPT against the built package
        run: yarn test:wpt:build
      - run: npm publish --access public
